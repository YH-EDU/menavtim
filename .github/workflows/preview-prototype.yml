# Preview for the prototype branch only.
# Does NOT deploy GitHub Pages and does not run on main.
# GitHub Pages is one site per repo (workflow deploy on main). A second
# deploy-pages run would replace https://yh-edu.github.io/menavtim/.
# This job only refreshes the orphan branch cursor/prototype-preview-eae0
# and, when secrets exist, a Netlify draft alias. The orphan branch is not
# itself a playable URL: GitHub and jsDelivr serve HTML as text/plain.

name: Prototype preview

on:
  push:
    branches:
      - cursor/prototype-v2-eae0
    paths:
      - 'app/**'
      - '.github/workflows/preview-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prototype-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build relative-base preview
        working-directory: app
        run: |
          npm ci
          npm run build:preview

      # Optional: a Netlify draft alias, only if the repo has these secrets.
      # This does not replace a production Netlify site (`--alias` is a draft URL).
      - name: Netlify draft alias if secrets exist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "No NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID — skipping playable preview URL."
            echo "GitHub cannot serve this branch as a second Pages site without replacing the live site."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --dir=app/dist --site="$NETLIFY_SITE_ID" --alias=prototype-v2

      - name: Publish orphan preview branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prototype-preview
          mkdir -p /tmp/prototype-preview
          cp -a app/dist/. /tmp/prototype-preview/
          cd /tmp/prototype-preview
          git init -b cursor/prototype-preview-eae0
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Prototype preview"
          # A fresh git init has no Actions credential helper, so the token has
          # to travel in the remote URL. Actions masks the secret in the log.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/YH-EDU/menavtim.git" HEAD:cursor/prototype-preview-eae0
